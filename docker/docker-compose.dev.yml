name: rerms-foundation
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: rerms
      POSTGRES_USER: rerms
      POSTGRES_PASSWORD: rerms_dev_password
    ports: ['55432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rerms -d rerms']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8.2.1-alpine
    ports: ['56379:6379']
    volumes: ['redis-data:/data']
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: rerms-dev-access
      MINIO_ROOT_PASSWORD: rerms-dev-secret
    ports: ['59000:9000', '59001:9001']
    volumes: ['minio-data:/data']
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  redis-data:
  minio-data:
