name: Foundation CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_DB: rerms, POSTGRES_USER: rerms, POSTGRES_PASSWORD: rerms_dev_password }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rerms -d rerms" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8.2.1-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env: { MINIO_ROOT_USER: rerms-dev-access, MINIO_ROOT_PASSWORD: rerms-dev-secret }
        ports: [59000:9000]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3001/api/v1
      DATABASE_URL: postgresql://rerms:rerms_dev_password@localhost:5432/rerms?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: error
      SESSION_TTL_HOURS: 24
      PASSWORD_RESET_TTL_MINUTES: 30
      PARTY_DATA_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      PARTY_DATA_ENCRYPTION_KEY_VERSION: v1
      PARTY_DATA_DECRYPTION_KEYS: ''
      PARTY_CONTACT_LOOKUP_KEY: 101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f
      AUTH_RATE_LIMIT_KEY: 202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f
      S3_ENDPOINT: http://localhost:59000
      S3_REGION: us-east-1
      S3_BUCKET: rerms-private-documents
      S3_ACCESS_KEY_ID: rerms-dev-access
      S3_SECRET_ACCESS_KEY: rerms-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
      SEED_COMPANY_CODE: RERMS
      SEED_BRANCH_CODE: HQ
      SEED_ADMIN_EMAIL: phase3.admin@example.test
      SEED_ADMIN_PASSWORD: Phase3-CI-Development-Only!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.17.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:governance
      - run: pnpm prisma:format
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run database integration tests
        run: pnpm --filter @rerms/database test:integration
      - name: Run API integration tests
        run: |
          set -o pipefail
          set +e
          pnpm --filter @rerms/api test:integration 2>&1 | tee api-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 25 api-integration.log | tr '\n' ' ' | tr '\r' ' ')
            echo "::error title=API integration failure::$summary"
            exit "$status"
          fi
      - run: pnpm test:e2e
      - run: pnpm build
